# Configuratie voor jaarverslag.py
#
# Projecten in Moneybird heten "CODE - omschrijving", bijvoorbeeld
# "C101 - Borrel drinks kwartaal 1". Het cijfer na de C bepaalt de
# categorie (tabel), de volledige code bepaalt de regel in die tabel.
# Alle projecten met dezelfde code worden bij elkaar opgeteld.
# De codes en regelnamen staan in codes.csv.

administration_id = "500528313044830083"   # Thalia Sandbox

[concrexit]
# Evenementen rechtstreeks van thalia.nu in plaats van events.csv. Eenmalig koppelen met
# "python3 jaarverslag.py --concrexit-login" of via het menu van het dashboard.
# De client_id hoort bij de OAuth-applicatie "Thalia jaarverslag" die de TechniCie op thalia.nu
# aanmaakt (public, authorization code, met de redirect-URI hieronder). Hij is niet geheim.
base_url = "https://thalia.nu"
client_id = ""
redirect_uri = "https://127.0.0.1/thalia-login"

[layout]
# Regels zonder budget en zonder boekingen weglaten uit de tabellen.
hide_empty_rows = true
# Code voor de regelnaam tonen, bijvoorbeeld "202 iCIS borrels".
show_codes = false
# Getalnotatie: 1,234.56 (zoals in eerdere verslagen).
thousands_separator = ","
decimal_separator = "."

# Volgorde hier = volgorde in de overzichtstabel.
[[categories]]
digit = "1"
name = "Borrels"
file = "borrels"

[[categories]]
digit = "2"
name = "Events"
file = "events"

[[categories]]
digit = "3"
name = "General"
file = "general"

[[categories]]
digit = "4"
name = "Board"
file = "board"

[[categories]]
digit = "5"
name = "Incidental earnings and losses"
file = "incidental"

[events]
# Evenementen staan als label [E<id>] in de omschrijving van een boekregel, of in de
# documentnaam: [E<id>] (zoals concrexit pusht) of los, bijv. "2627017 E1206", met het
# event-id uit concrexit. Naam, datum en organizer komen uit events.csv (export uit
# concrexit); per organizer komt er een tabel met zijn evenementen en hun resultaat.
#
# Codes waar elke boekregel een label hoort te hebben. Regels zonder label onder deze
# codes komen op de waarschuwingenlijst. Andere codes (bijv. C208, dat is één evenement)
# hoeven geen label, maar een label telt daar wel mee.
label_codes = [
    "C101",                   # Borrel drinks
    "C102",                   # Borrel snacks
    "C103",                   # Borrel decoration
    "C104",                   # Alumni borrels
    "C106",                   # Other borrels
    "C201",                   # Events committee
    "C202",                   # Turing committee
    "C204",                   # First year committee
    "C211",                   # Wine tasting
    "C212",                   # Lunch lectures costs
    "C216",                   # Other events
    "C217",                   # Lustrum
]

# Waarschuwing als de boekingsdatum meer dan zoveel dagen van de evenementdatum afligt.
max_days = 60

# Optioneel: nettere namen voor de organizers in het verslag. Links de naam zoals hij in events.csv
# staat, of de commissienaam op thalia.nu als de evenementen daarvandaan komen.
[events.organizers]
CAD = "BorrelCie"
EVC = "Events Committee"
TURINGCIE = "Turing Committee"
PARTNERCIE = "Partner Committee"
TECHNICIE = "TechniCie"
ALU = "Alumni"
WINECIE = "Wine Tasting"

